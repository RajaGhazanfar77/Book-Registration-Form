<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Registration Form</title>
    <style>
        .form-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .form-section { margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .required { color: red; font-size: 0.8em; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; }
        .form-note { font-size: 0.9em; color: #666; margin-top: -5px; }
        .form-buttons { text-align: center; margin-top: 20px; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Book Registration Form</h1>
        
        <form id="bookRegistration">
            <!-- Book Information Section -->
            <div class="form-section">
                <h2>Book Information <span class="required">* Required fields</span></h2>

                <!-- Required Fields -->
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" required placeholder="Include subtitle if applicable">

                <label for="authors">Author(s) *</label>
                <input type="text" id="authors" name="authors" required 
                       placeholder="Separate multiple authors with commas">

                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" pattern="^(?:\d{9}[\dXx]|\d{13})$"
                       placeholder="Enter 10 or 13-digit ISBN (if available)">
                <div class="form-note">Include hyphens if desired (e.g., 978-3-16-148410-0)</div>

                <label for="pubYear">Publication Year *</label>
                <input type="number" id="pubYear" name="pubYear" required 
                       min="1800" max="2024" step="1" value="2024">

                <label for="publisher">Publisher *</label>
                <input type="text" id="publisher" name="publisher" required>

                <label for="format">Format *</label>
                <select id="format" name="format" required>
                    <option value="">Select Format</option>
                    <option>Hardcover</option>
                    <option>Paperback</option>
                    <option>eBook</option>
                    <option>Audiobook</option>
                    <option>PDF</option>
                    <option>Other</option>
                </select>

                <label for="genre">Genre *</label>
                <select id="genre" name="genre" required>
                    <option value="">Select Genre</option>
                    <option>Fiction</option>
                    <option>Non-Fiction</option>
                    <option>Science Fiction</option>
                    <option>Fantasy</option>
                    <option>Mystery</option>
                    <option>Romance</option>
                    <option>Biography</option>
                    <option>Textbook</option>
                    <option>Children's Literature</option>
                    <option>Other</option>
                </select>

                <!-- Optional Fields -->
                <h3>Additional Information (Optional)</h3>

                <label for="series">Series Title</label>
                <input type="text" id="series" name="series">

                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <label for="volume">Volume Number</label>
                        <input type="number" id="volume" name="volume" min="1">
                    </div>
                    <div style="flex: 1;">
                        <label for="edition">Edition</label>
                        <select id="edition" name="edition">
                            <option value="">Select Edition</option>
                            <option>First Edition</option>
                            <option>Revised Edition</option>
                            <option>Special Edition</option>
                            <option>Anniversary Edition</option>
                        </select>
                    </div>
                </div>

                <label for="language">Language</label>
                <input type="text" id="language" name="language" placeholder="Original publication language">

                <label for="pages">Number of Pages</label>
                <input type="number" id="pages" name="pages" min="1">

                <label for="illustrators">Illustrator(s)</label>
                <input type="text" id="illustrators" name="illustrators">

                <label for="translators">Translator(s)</label>
                <input type="text" id="translators" name="translators">
            </div>

            <div class="form-buttons">
                <button type="submit">Register Book</button>
                <button type="reset">Clear Form</button>
            </div>
        </form>
    </div>
</body>
</html>
